<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#138a7e">
<title>Raíz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Plan: un solo mundo claro (como las capturas). Columna de teléfono centrada, tarjetas blancas de borde suave,
   íconos en círculos menta, botón principal verde azulado, títulos azul marino, naranja solo para recordatorios. */
:root{
  --bg:#f6faf9; --surface:#ffffff; --navy:#13294b; --ink:#22303f; --muted:#5f6b76; --line:#e2ece9;
  --teal:#138a7e; --teal-2:#3aa99a; --teal-ink:#ffffff; --mint:#e7f4f1; --mint-2:#f0f8f6;
  --green:#1f9d55; --orange:#ef8a26; --orange-soft:#fff4e9; --red:#c0392b; --red-soft:#fdecea;
  --display:"Outfit","Segoe UI",system-ui,sans-serif; --body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--surface);padding:18px 20px 112px;position:relative}
@media (min-width:520px){ body{padding:20px 0} .app{border-radius:28px;box-shadow:0 10px 40px rgba(19,41,75,.08);min-height:calc(100% - 40px)} }
.app.notabs{padding-bottom:32px}
h1,h2,h3{font-family:var(--display);color:var(--navy);text-wrap:balance;margin:0 0 8px;letter-spacing:-.01em}
h1{font-size:32px;line-height:1.12;font-weight:700} h2{font-size:22px;font-weight:600} h3{font-size:18px;font-weight:600}
p{margin:0 0 12px} .muted{color:var(--muted)} .small{font-size:14px} .center{text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;min-height:56px}
.circle{width:52px;height:52px;border-radius:50%;background:var(--mint);display:grid;place-items:center;border:0;color:var(--teal);cursor:pointer;flex:none;position:relative}
.circle svg{width:24px;height:24px}
.circle .dot{position:absolute;top:10px;right:11px;width:10px;height:10px;border-radius:50%;background:var(--orange);border:2px solid var(--mint)}
.spacer{width:52px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.word{font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:-.01em;color:var(--navy)}
.word span{color:var(--teal)}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icircle{width:54px;height:54px;border-radius:50%;background:var(--mint);display:grid;place-items:center;color:var(--teal);flex:none}
.icircle.lg{width:72px;height:72px} .icircle.lg .ico{width:32px;height:32px}
.icircle.sm{width:42px;height:42px} .icircle.sm .ico{width:20px;height:20px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:20px;margin-bottom:16px}
.card.tint{background:var(--mint-2);border-color:#bfe2db}
.card.orange{background:var(--orange-soft);border-color:#f6c08c}
.card.red{background:var(--red-soft);border-color:#f2b8b1}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border-radius:14px;min-height:58px;padding:12px 18px;font:600 19px var(--display);cursor:pointer;border:2px solid transparent;text-decoration:none}
.btn .ico{width:26px;height:26px}
.btn.main{background:var(--teal);color:var(--teal-ink)}
.btn.main:hover{background:#0f7a6f}
.btn.outline{background:var(--surface);color:var(--teal);border-color:var(--teal)}
.btn.soft{background:var(--mint);color:var(--teal)}
.btn.danger{background:var(--surface);color:var(--red);border-color:var(--red)}
.btn.small{min-height:46px;font-size:16px;border-radius:12px}
.stack{display:grid;gap:12px}
.link{display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:0;color:var(--muted);font:600 15px var(--body);cursor:pointer;margin:14px auto 0;padding:8px}
.link .ico{width:20px;height:20px;color:var(--teal)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--teal-2);outline-offset:2px}
/* formularios */
.field{display:grid;grid-template-columns:54px 1fr;gap:14px;margin-bottom:22px;align-items:start}
.field .icircle{margin-top:-4px}
.field label,.flabel{display:block;font-weight:700;color:var(--navy);margin:6px 0 8px;font-size:17px}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 8px}
input[type=text],input[type=tel],input[type=number],input[type=password],input[type=date],textarea,select{width:100%;background:var(--surface);color:var(--ink);border:1.5px solid #d3dedb;border-radius:12px;padding:14px 16px;font:400 17px var(--body)}
textarea{min-height:90px;resize:vertical}
.suffix{position:relative} .suffix span{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted)}
.radios{display:grid;gap:10px}
.radio{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1.5px solid #d3dedb;border-radius:12px;padding:14px 16px;font:600 17px var(--body);color:var(--navy);cursor:pointer}
.radio .ico{color:var(--teal)}
.radio .rdot{width:22px;height:22px;border-radius:50%;border:2px solid #b9c6c3;flex:none;display:grid;place-items:center}
.radio[aria-pressed="true"]{border-color:var(--teal);background:var(--mint-2)}
.radio[aria-pressed="true"] .rdot{border-color:var(--teal)}
.radio[aria-pressed="true"] .rdot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--teal)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{width:52px;height:30px;border-radius:999px;background:#cfd9d6;border:0;position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"]{background:var(--teal)} .switch[aria-checked="true"]::after{left:25px}
.err{color:var(--red);font-size:15px;min-height:1.2em;margin:4px 0 0}
.ok{color:var(--green);font-size:15px;min-height:1.2em;margin:4px 0 0}
/* inicio */
.dayscard{display:flex;align-items:center;gap:12px;padding:18px 16px;overflow:hidden}
.dayscard .num{font:700 46px/1 var(--display);color:var(--teal);font-variant-numeric:tabular-nums}
.dayscard .num small{font-size:22px;font-weight:600;margin-left:4px}
.dayscard .lbl{color:var(--navy);font-weight:600}
.dayscard .art{margin-left:auto;width:120px;flex:none}
.status{display:flex;align-items:center;gap:14px}
.status .txt{flex:1}
.status h2{display:flex;align-items:center;gap:10px;font-size:24px;color:var(--teal)}
.gdot{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#5fd37f,#1f9d55);flex:none}
.gdot.o{background:radial-gradient(circle at 35% 35%,#ffb466,#ef8a26)}
.shield{width:78px;height:78px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--green);flex:none}
.shield .ico{width:40px;height:40px}
.section-t{font:600 20px var(--display);color:var(--navy);margin:22px 0 12px}
.ind{border:1.5px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:16px}
.irow{display:grid;grid-template-columns:62px 1fr 40px;gap:14px;align-items:center;padding:16px;border-top:1.5px solid var(--line)}
.irow:first-child{border-top:0}
.irow .icircle{width:62px;height:62px}
.irow b{display:block;color:var(--navy);font:600 18px var(--display)}
.irow small{color:var(--muted);font-size:14px}
.bar{height:10px;background:#e9f0ee;border-radius:6px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--teal);border-radius:6px}
.bar.o i{background:var(--orange)}
.check{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.check.o{background:var(--orange)} .check.g{background:#c9d4d1}
.check .ico{width:20px;height:20px;stroke-width:2.6}
.verse{position:relative}
.verse q{display:block;font:500 19px/1.45 var(--display);color:var(--navy);quotes:"“" "”"}
.verse cite{display:block;font-style:normal;font-weight:700;color:var(--teal);margin-top:8px}
.list{list-style:none;padding:0;margin:4px 0 0}
.list li{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .check{width:30px;height:30px;flex:none} .list .check .ico{width:17px;height:17px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--mint);color:var(--teal);margin:0 6px 6px 0}
/* antojo */
.reminder{display:flex;gap:14px;align-items:flex-start;position:relative;overflow:hidden}
.reminder h2{font-size:23px}
.warnico{color:var(--orange);flex:none}
.warnico svg{width:42px;height:42px}
.funcgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.func{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px;text-align:left;cursor:pointer;font:400 15px var(--body);color:var(--muted)}
.func b{display:block;font:600 18px var(--display);color:var(--navy);margin:8px 0 2px}
.func:hover{border-color:var(--teal)}
.timer{font:700 56px/1 var(--display);text-align:center;color:var(--teal);font-variant-numeric:tabular-nums;margin:6px 0}
.breath{width:150px;height:150px;border-radius:50%;margin:10px auto;background:var(--mint);border:3px solid var(--teal);display:grid;place-items:center;font:600 18px var(--display);color:var(--teal);transition:transform 4s ease-in-out}
.breath.in{transform:scale(1.22)}
input[type=range]{width:100%;accent-color:var(--teal)}
.rval{font:700 22px var(--display);color:var(--teal);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1.5px solid #d3dedb;border-radius:999px;padding:8px 14px;font:600 15px var(--body);color:var(--navy);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--mint);border-color:var(--teal);color:var(--teal)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{border:1.5px solid #d3dedb;background:var(--surface);border-radius:12px;padding:10px 2px;font:600 13px var(--body);color:var(--navy);cursor:pointer;display:grid;justify-items:center;gap:2px}
.seg button span{font-size:24px;line-height:1}
.seg button[aria-pressed="true"]{border-color:var(--teal);background:var(--mint)}
/* historial */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;border:1.5px solid var(--line);border-radius:22px;padding:14px;margin-bottom:16px}
.tile{border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:10px;align-items:flex-start}
.tile .icircle{width:46px;height:46px} .tile .icircle .ico{width:22px;height:22px}
.tile span{display:block;color:var(--navy);font-weight:700;font-size:14px;line-height:1.25}
.tile b{display:block;font:700 30px/1.1 var(--display);color:var(--teal);margin-top:6px;font-variant-numeric:tabular-nums}
.tile b.o{color:var(--orange)} .tile b small{font-size:16px;font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12px var(--body)}
.log{border-top:1px solid var(--line);padding:12px 0} .log:first-child{border-top:0}
.log .lt{display:flex;justify-content:space-between;font-weight:700;color:var(--navy)}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.tag.g{background:var(--mint);color:var(--teal)} .tag.r{background:var(--red-soft);color:var(--red)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px dashed #c9d6d3;border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}
/* perfil */
.me{display:flex;gap:14px;align-items:center}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font:700 26px var(--display);flex:none}
.menu{border:1.5px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:16px}
.mi{display:flex;align-items:center;gap:14px;width:100%;background:var(--surface);border:0;border-top:1.5px solid var(--line);padding:14px 16px;text-align:left;font:600 17px var(--body);color:var(--navy);cursor:pointer}
.mi:first-child{border-top:0}
.mi .sub{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.mi .chev{margin-left:auto;color:var(--muted)}
.person{display:grid;grid-template-columns:1fr 1fr 46px;gap:8px;margin-bottom:8px}
.person button{border:1.5px solid #d3dedb;background:var(--surface);border-radius:12px;font-size:20px;color:var(--muted);cursor:pointer}
/* test */
.q{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)} .q:first-of-type{border-top:0;padding-top:0}
.qt{font-weight:700;color:var(--navy);margin-bottom:10px}
.opts{display:grid;gap:8px} .opts.row{grid-template-columns:repeat(auto-fit,minmax(70px,1fr))}
.opt{display:block;text-align:left;width:100%;background:var(--surface);color:var(--ink);border:1.5px solid #d3dedb;border-radius:12px;padding:12px 14px;font:600 16px var(--body);cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--mint);color:var(--teal)}
.progress{height:8px;background:#e9f0ee;border-radius:5px;overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--teal)}
.level{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;background:var(--mint-2);border:1.5px solid #bfe2db;margin:10px 0}
.level .n{flex:none;width:50px;height:50px;border-radius:14px;background:var(--teal);color:#fff;display:grid;place-items:center;font:700 22px var(--display)}
.fbar{display:grid;grid-template-columns:118px 1fr 40px;gap:10px;align-items:center;font-size:15px;margin-bottom:6px}
.fbar b{text-align:right;font-variant-numeric:tabular-nums}
ul.plain{padding-left:20px;margin:6px 0 12px} ul.plain li{margin-bottom:6px}
/* barra inferior */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--surface);border-top:1.5px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
@media (min-width:520px){.tabbar{bottom:20px;border-radius:0 0 28px 28px}}
.tab{background:none;border:0;color:var(--muted);font:700 12px var(--body);padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
.tab[aria-current="page"]{color:var(--teal);background:var(--mint)}
.hidden{display:none!important}
/* crisis */
.overlay{position:fixed;inset:0;background:rgba(19,41,75,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.overlay.open{display:flex}
.overlay .card{max-width:440px;width:100%;max-height:90vh;overflow:auto;margin:0}
.tel{display:block;font:700 26px var(--display);color:var(--red);text-decoration:none}
.sosfab{position:fixed;right:max(16px,calc(50% - 224px));bottom:96px;z-index:6;background:var(--red);color:#fff;border:0;border-radius:999px;padding:10px 16px;font:700 14px var(--body);box-shadow:0 6px 18px rgba(192,57,43,.3);cursor:pointer}
@media (prefers-reduced-motion: reduce){.breath,.switch::after{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div id="view" aria-live="polite"></div>
</div>
<button class="sosfab hidden" id="sosBtn" type="button">Ayuda ya</button>
<nav class="tabbar hidden" id="tabbar" aria-label="Secciones"></nav>

<div class="overlay" id="crisis" role="dialog" aria-modal="true" aria-labelledby="crisisTitle">
  <div class="card">
    <h2 id="crisisTitle">No estás solo. Hay ayuda ahora mismo.</h2>
    <p>Si estás en peligro o piensas hacerte daño, llama ya:</p>
    <p class="muted small" style="margin:0">Emergencias en Ecuador</p>
    <a class="tel" href="tel:911">911</a>
    <p class="muted small" style="margin:10px 0 0">Ministerio de Salud Pública, apoyo psicológico gratuito</p>
    <a class="tel" href="tel:171">171, opción 6</a>
    <p class="small muted">Marca 171 y elige la opción 6. Si no contestan, llama al 911.</p>
    <div id="crisisPeople"></div>
    <button class="btn main" id="closeCrisis" type="button" style="margin-top:8px">Ya estoy a salvo, continuar</button>
  </div>
</div>

function usedDates(){ var m={}; S.logs.forEach(function(l){ if(l.used) m[l.date]=1; }); return Object.keys(m); }
function stats(){
  var t=today(), cur=S.cleanSince?Math.max(0,diffDays(S.cleanSince,t)):0;
  var ud=usedDates().filter(function(d){return S.start&&d>=S.start;});
  var total=S.start?Math.max(0,diffDays(S.start,t)+1-ud.length):0;
  var best=0;
  if(S.start){ var used={}; ud.forEach(function(d){used[d]=1;}); var run=0,d=S.start,g=0; while(d<t&&g<5000){ if(used[d]) run=0; else { run++; if(run>best) best=run; } d=addDays(d,1); g++; } }
  if(cur>best) best=cur;
  return {cur:cur,total:total,best:best};
}
function todayLog(){ var t=today(); for(var i=S.logs.length-1;i>=0;i--) if(S.logs[i].date===t) return S.logs[i]; return null; }
function lastDays(n){ var out=[]; for(var i=n-1;i>=0;i--) out.push(addDays(today(),-i)); return out; }

    '<div class="card"><label class="flabel" for="nt">Nota</label><textarea id="nt" placeholder="Qué pasó, cómo lo manejé, algo bueno de hoy…">'+esc(tl.note)+'</textarea></div>'+

    $("cr").addEventListener("input",function(){ $("crv").textContent=this.value; });
    if($("u0")){ $("u0").addEventListener("click",function(){ d.used=false; this.setAttribute("aria-pressed","true"); $("u1").setAttribute("aria-pressed","false"); }); $("u1").addEventListener("click",function(){ d.used=true; this.setAttribute("aria-pressed","true"); $("u0").setAttribute("aria-pressed","false"); }); }
    view.querySelectorAll("[data-tr]").forEach(function(b){ b.addEventListener("click",function(){ var t=b.getAttribute("data-tr"),i=d.trig.indexOf(t); if(i>=0) d.trig.splice(i,1); else d.trig.push(t); b.setAttribute("aria-pressed",String(i<0)); }); });
    $("saveLog").addEventListener("click",function(){
      if(!d.mood){ $("lgErr").textContent="Elige cómo te sientes para guardar."; return; }
      var t=today(), wasUsed=false;
      S.logs=S.logs.filter(function(l){ if(l.date===t){ wasUsed=l.used; return false; } return true; });
      var entry={date:t,mood:d.mood,crave:+$("cr").value,used:isRec()&&d.used,trig:d.trig,note:$("nt").value.slice(0,2000)};

function tile(icon,label,val,suf,orange){ return '<div class="tile"><span class="icircle"'+(orange?' style="color:var(--orange);background:var(--orange-soft)"':'')+'>'+ic(icon)+'</span><div><span>'+label+'</span><b'+(orange?' class="o"':'')+'>'+val+(suf||'')+'</b></div></div>'; }
function barChart(days,m){
  var W=320,H=170,pl=34,pb=24,top=10,ch=H-pb-top,bw=(W-pl)/7;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Ánimo de los últimos 7 días, de 0 a 100 por ciento">';
  [0,25,50,75,100].forEach(function(v){ var y=top+ch-(v/100)*ch; s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="#e6eeec" stroke-dasharray="3 4"/><text x="0" y="'+(y+4)+'">'+v+'%</text>'; });
  days.forEach(function(d,i){ var l=m[d], x=pl+i*bw+bw*0.22, w=bw*0.56;
    if(l){ var hh=Math.max(4,l.mood/5*ch); s+='<rect x="'+x+'" y="'+(top+ch-hh)+'" width="'+w+'" height="'+hh+'" rx="6" fill="'+(l.used?'#e07a6e':'#3aa99a')+'"><title>'+fmt(d)+': '+["","Muy mal","Mal","Regular","Bien","Muy bien"][l.mood]+'</title></rect>'; }
    else s+='<rect x="'+x+'" y="'+(top+ch-3)+'" width="'+w+'" height="3" rx="1.5" fill="#d6e2df"/>';
    s+='<text x="'+(x+w/2)+'" y="'+(H-4)+'" text-anchor="middle">'+(d===today()?'Hoy':DIAS[parseD(d).getDay()])+'</text>'; });
  return s+'</svg><p class="small muted" style="margin:4px 0 0">Barra gris: sin registro. Barra rosada: día con consumo.</p>';
}
function lineChart(days,m){
  var W=320,H=160,pl=28,pb=24,top=12,ch=H-pb-top,step=(W-pl-14)/6;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Intensidad diaria de 0 a 10 en los últimos 7 días"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3aa99a" stop-opacity=".28"/><stop offset="1" stop-color="#3aa99a" stop-opacity="0"/></linearGradient></defs>';
  [0,5,10].forEach(function(v){ var y=top+ch-(v/10)*ch; s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="#e6eeec" stroke-dasharray="3 4"/><text x="4" y="'+(y+4)+'">'+v+'</text>'; });
  var pts=[];
  days.forEach(function(d,i){ var x=pl+7+i*step; s+='<text x="'+x+'" y="'+(H-4)+'" text-anchor="middle">'+(d===today()?'Hoy':DIAS[parseD(d).getDay()])+'</text>'; if(m[d]) pts.push([x,top+ch-(m[d].crave/10)*ch,m[d].crave,d]); });
  if(pts.length>1){ var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(" "); s+='<path d="'+line+' L'+pts[pts.length-1][0].toFixed(1)+' '+(top+ch)+' L'+pts[0][0].toFixed(1)+' '+(top+ch)+'Z" fill="url(#ga)"/><path d="'+line+'" fill="none" stroke="#138a7e" stroke-width="2.5" stroke-linejoin="round"/>'; }
  pts.forEach(function(p,i){ s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i===pts.length-1?6:5)+'" fill="#fff" stroke="#138a7e" stroke-width="2.5"><title>'+fmt(p[3])+': '+p[2]+'/10</title></circle>'; });
  if(!pts.length) s+='<text x="'+(W/2)+'" y="'+(top+ch/2)+'" text-anchor="middle">Aún no hay registros esta semana</text>';
  return s+'</svg>';
}
function patterns(){

  if(A.s3==="si") h+='<div class="card red"><b>Estás viviendo violencia.</b> Tienes derecho a estar a salvo. En peligro inmediato llama al <b>911</b>. También puedes acudir a la Fiscalía o a una organización de apoyo a víctimas. Tú decides cuándo y cuánto contar.</div>';
  h+='<div class="card">';
  if(r.detox) h+='<h3>Paso 1</h3><div class="level"><span class="n">4</span><div><b style="color:var(--navy)">'+esc(LEVELS.N4.name)+'</b><p class="small" style="margin:6px 0 0">'+esc(LEVELS.N4.what)+'</p></div></div><h3>Paso 2</h3>';
  else h+='<h3>Tipo de tratamiento recomendado</h3>';
  h+='<div class="level"><span class="n">'+L.n+'</span><div><b style="color:var(--navy)">'+esc(L.name)+'</b><p class="small" style="margin:6px 0 0">'+esc(L.what)+'</p></div></div><p style="margin:12px 0 6px"><b>Tu equipo:</b></p><div>'+L.team.map(function(t){return '<span class="pill">'+esc(t)+'</span>';}).join("")+'</div></div>';
  h+='<div class="card tint"><h2>Tu perfil: '+esc(P.name)+'</h2><p>'+esc(P.why)+'</p>'+(P2?'<p class="small muted">También tienes rasgos de <b>'+esc(P2.name)+'</b>. Trabaja primero tu perfil principal.</p>':'')+
    '<p style="margin:10px 0 8px"><b>Qué te daba la sustancia</b></p>'+fbar("Intensidad",r.F.I)+fbar("Escape",r.F.E)+fbar("Conexión",r.F.C)+fbar("Apagar el dolor",r.F.D)+'<p class="small muted" style="margin:6px 0 0">6 o más = función fuerte.</p>';
  if(prev&&prev.F){ var tot=function(F){return F.I+F.E+F.C+F.D;}; var d=tot(r.F)-tot(prev.F); h+='<p class="small" style="margin:10px 0 0">Comparado con tu test del '+fmt(prev.date)+': '+(d<0?'la fuerza de las funciones bajó '+(-d)+' puntos. Vas avanzando.':d>0?'subió '+d+' puntos. Es un buen momento para pedir más apoyo.':'se mantiene igual.')+'</p>'; }
  h+='</div><div class="card"><h3>Terapias recomendadas</h3>'+plist(P.therapy)+'</div><div class="card"><h3>Tus sustitutos sanos</h3>'+plist(P.sub)+'</div>';
  h+='<div class="card orange"><h3>Evita</h3><ul class="plain">'+P.avoid.concat(["Cambiar la sustancia por otra “más suave”, hierbas o pastillas sin receta"]).map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>';
  h+='<div class="card"><h3>Tus primeros 7 días</h3>'+plist((r.detox?LEVELS.N4.first:[]).concat(L.first))+'</div>';
  var flags=[A.s1==="si"?"riesgo-suicida":"",A.s2==="si"?"abstinencia-fisica":"",A.s3==="si"?"violencia":"",A.s4==="si"?"sobredosis":"",A.mental==="si"?"salud-mental":""].filter(Boolean);
  var code="RAIZ-"+(r.detox?"N4>":"")+L.n+"-"+r.primary+(r.second?"/"+r.second:"")+"-I"+r.F.I+"E"+r.F.E+"C"+r.F.C+"D"+r.F.D+"-G"+r.sev;
  var summary="Código: "+code+"\nNivel sugerido: "+(r.detox?"4 (desintoxicación médica) y luego ":"")+L.n+" ("+L.name+")\nPerfil: "+P.name+(P2?" · secundario: "+P2.name:"")+"\nFunciones (0-9): Intensidad "+r.F.I+", Escape "+r.F.E+", Conexión "+r.F.C+", Dolor "+r.F.D+"\nSustancia principal: "+A.sust+" · frecuencia "+A.freq+"/4 · gravedad "+r.sev+"/15\nAlertas: "+(flags.length?flags.join(", "):"ninguna")+"\nOrientativo, no es diagnóstico.";
  h+='<div class="card"><h3>Código para tu profesional</h3><p class="small muted">Muéstralo en tu primera cita. No contiene tu nombre.</p><div class="code">'+esc(summary)+'</div></div>';
  h+='<div class="stack"><button class="btn main" type="button" id="saveProf">'+ic("save")+'Guardar mi perfil</button><button class="btn outline small" type="button" id="copy">Copiar resumen</button></div><p class="ok center" id="msg"></p>';
  h+='<p class="small muted">Este resultado es una orientación. Un psicólogo, psiquiatra o médico debe confirmar el tratamiento. Repite el test cada 4 semanas.</p>';
  view.innerHTML=h; bindHeader(function(){ go("perfil"); });
  if($("reopen")) $("reopen").addEventListener("click",openCrisis);
  $("copy").addEventListener("click",function(){ copyText(summary,$("msg")); });
  $("saveProf").addEventListener("click",function(){ S.profile={date:today(),level:r.base,detox:r.detox,primary:r.primary,second:r.second,F:r.F,code:code}; save(); $("msg").textContent=storageOK?"Perfil guardado.":"No se pudo guardar en este navegador."; });
}

/* ===================== Crisis ===================== */
var ov=$("crisis");
function openCrisis(){
  var p=S.plan.people.filter(function(x){return x.name||x.phone;});
  $("crisisPeople").innerHTML=p.length?'<h3>Tu gente</h3>'+p.map(function(x){return '<p style="margin:0 0 6px"><b>'+esc(x.name)+'</b> '+(x.phone?'<a href="tel:'+esc(x.phone.replace(/[^0-9+]/g,""))+'" style="color:var(--teal);font-weight:700">'+esc(x.phone)+'</a>':'')+'</p>';}).join(""):'<p>Si puedes, escribe ahora a alguien de confianza: “¿Puedes venir o llamarme? No estoy bien.”</p>';
  ov.classList.add("open"); $("closeCrisis").focus();
}
$("closeCrisis").addEventListener("click",function(){ ov.classList.remove("open"); });
sos.addEventListener("click",openCrisis);
document.addEventListener("keydown",function(e){ if(e.key==="Escape") ov.classList.remove("open"); });

/* ===================== Arranque ===================== */
if(!S.user) welcome();
else if(S.user.pin) welcome();
else { unlocked=true; go("inicio"); }
})();
</script>
